name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub ubuntu-latest already supplies the Android SDK and modern sdkmanager.
      # Do not use android-actions/setup-android@v3: it runs "sdkmanager tools"
      # which fails because the deprecated SDK "tools" package no longer exists.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No SDK manager on runner: installing Android command-line tools"
            curl -fsSL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "${ANDROID_HOME}/cmdline-tools/latest"
            unzip -q /tmp/cmdline.zip -d /tmp/cmdline-extract
            cp -a /tmp/cmdline-extract/cmdline-tools/. "${ANDROID_HOME}/cmdline-tools/latest/"
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_HOME}" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="${ANDROID_HOME}" --install "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Install Vulkan shader toolchain (host)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends glslc libvulkan-dev spirv-headers
          glslc --version
          # The Android NDK ships vulkan.h but not Vulkan-Hpp C++ wrappers.
          # Copy JUST the Vulkan header tree to a private CI directory, not
          # the host /usr/include (which contains incompatible glibc headers).
          mkdir -p third_party/vulkan_headers
          cp -a /usr/include/vulkan third_party/vulkan_headers/
          # SPIRV-Headers also ships header-only C++ definitions absent
          # from Android NDK; stage them with Vulkan-Hpp for cross-build.
          cp -a /usr/include/spirv third_party/vulkan_headers/
          test -f third_party/vulkan_headers/vulkan/vulkan.hpp
          test -f third_party/vulkan_headers/spirv/unified1/spirv.hpp
          echo "SPIR-V headers:"
          find /usr -name 'SPIRV-HeadersConfig.cmake' -o -name 'SPIRV-Headers-config.cmake' 2>/dev/null | head
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Fetch pinned llama.cpp source for embedded inference
        run: bash scripts/fetch_llama_cpp.sh
      - name: Verify downloadable AI model and labels
        run: bash scripts/verify_ai_models.sh
      - name: Restore persistent APK signing (optional)
        env:
          AMPYEOS_KEYSTORE_BASE64: ${{ secrets.AMPYEOS_KEYSTORE_BASE64 }}
          AMPYEOS_STORE_PASSWORD_SECRET: ${{ secrets.AMPYEOS_STORE_PASSWORD }}
          AMPYEOS_KEY_ALIAS_SECRET: ${{ secrets.AMPYEOS_KEY_ALIAS }}
          AMPYEOS_KEY_PASSWORD_SECRET: ${{ secrets.AMPYEOS_KEY_PASSWORD }}
        run: |
          if [ -n "$AMPYEOS_KEYSTORE_BASE64" ] && \
             [ -n "$AMPYEOS_STORE_PASSWORD_SECRET" ] && \
             [ -n "$AMPYEOS_KEY_ALIAS_SECRET" ] && \
             [ -n "$AMPYEOS_KEY_PASSWORD_SECRET" ]; then
            printf '%s' "$AMPYEOS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ampyeos-signing.jks"
            chmod 600 "$RUNNER_TEMP/ampyeos-signing.jks"
            echo "AMPYEOS_SIGNING_FILE=$RUNNER_TEMP/ampyeos-signing.jks" >> "$GITHUB_ENV"
            echo "AMPYEOS_SIGNING_PASSWORD=$AMPYEOS_STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "AMPYEOS_SIGNING_ALIAS=$AMPYEOS_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "AMPYEOS_SIGNING_KEY_PASSWORD=$AMPYEOS_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "Persistent signature configured; debug updates will keep the same signing certificate."
          else
            echo "::warning::No permanent signing key configured. Different CI debug APKs may require uninstall. Set four repository Action secrets to allow in-place updates."
          fi
      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AmpyEOS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
